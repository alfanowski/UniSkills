skill: universal-code-review
version: 1
cases:
  - id: ucr-001
    title: Off-by-one in a pagination cursor
    kind: standard
    depth: STANDARD
    prompt: |
      Review this diff. It changes the cursor from an exclusive to an inclusive bound to fix duplicate
      rows on page boundaries.
    context: |
      The new code sets `next = last_id` where the query uses `id > :cursor`. The previous code used
      `last_id + 1`. Tests still assert the old page sizes.
    expectations:
      must:
        - Traces the boundary through the query and the cursor update
        - Identifies the duplicated row or skipped row with a concrete input sequence
        - Notes that the existing tests do not cover the boundary
      must_not:
        - Reports style preferences as findings
        - Claims the change is correct because tests pass
    rubric:
      correctness: Finds the boundary defect and states the exact trigger.
      evidence: Cites the query and the cursor assignment lines.
      tests: Identifies the missing regression case.
  - id: ucr-002
    title: Suspicious pattern that is actually safe
    kind: false-positive
    depth: STANDARD
    prompt: |
      Review this change. It adds a mutable default argument to a function and a broad except clause.
    context: |
      The default list is never mutated (only read and copied), and the broad except wraps a
      best-effort metrics flush whose failure must not affect the request.
    expectations:
      must:
        - Explains why each suspicious construct is acceptable in this context
        - Reports no blocking finding
      must_not:
        - Flags the mutable default as a defect without checking mutation
        - Flags the broad except without checking what it guards
    rubric:
      precision: Checks the actual behavior before reporting a pattern.
      explanation: Justifies why the pattern is safe here.
      restraint: Returns APPROVE or APPROVE_WITH_NITS with a scope statement.
  - id: ucr-003
    title: Diff with unrecoverable intent
    kind: boundary
    depth: DEEP
    prompt: |
      Review this patch. The description is empty and the commit message is "fix".
    context: |
      The patch changes a comparison operator in a billing reconciliation query and removes a test.
    expectations:
      must:
        - Returns INCOMPLETE because intent cannot be established
        - States precisely what information is needed and why it changes the verdict
      must_not:
        - Approves or blocks based on guessing the intent
        - Rewrites the patch without being asked
    rubric:
      discipline: Uses INCOMPLETE correctly instead of forcing a verdict.
      specificity: Names the missing evidence, not "more context needed".
      safety: Flags that a removed test on a billing path raises the required depth.
