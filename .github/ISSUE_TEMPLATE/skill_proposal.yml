name: Skill proposal
description: Propose a new skill, a new pack, or a change to the taxonomy.
title: "[skill]: "
labels: ["skill-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Read `docs/skill-authoring-standard.md` first. A proposal that duplicates an existing skill, or
        that wraps a single tool call, will be declined.

  - type: input
    id: name
    attributes:
      label: Proposed skill id
      description: Lowercase, hyphenated, task-oriented. Not a persona, not a tool name.
      placeholder: "api-contract-review"
    validations:
      required: true

  - type: textarea
    id: capability
    attributes:
      label: What capability does it add
      description: One paragraph. What decision does the user make with it that they cannot make today?
    validations:
      required: true

  - type: textarea
    id: triggers
    attributes:
      label: When should it activate
      description: Concrete requests and artifacts, in the user's words.
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: When should it NOT activate
      description: Name the nearest adjacent skill and why this one is different. At least three exclusions.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: What evidence would it require
      description: What must a finding prove, and what pointer would a reader check?
    validations:
      required: true

  - type: textarea
    id: evals
    attributes:
      label: Proposed evaluation cases
      description: One standard case, one boundary case, one case where the correct behavior is to stay silent.
    validations:
      required: true

  - type: dropdown
    id: catalog
    attributes:
      label: Does it replace an existing catalog entry?
      options:
        - "No, it is a new capability"
        - "Yes, it replaces or merges an existing planned entry"
        - "Not sure"
    validations:
      required: true
