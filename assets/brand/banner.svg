<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none" role="img" aria-label="UniSkills — universal, evidence-driven skills for AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0F1E"/>
      <stop offset="0.55" stop-color="#111731"/>
      <stop offset="1" stop-color="#0D1226"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.1" r="0.85">
      <stop stop-color="#6366F1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.6">
      <stop stop-color="#A855F7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#FFFFFF" fill-opacity="0.055"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="320" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
    <rect width="1280" height="320" fill="url(#glow2)"/>
    <rect width="1280" height="320" fill="url(#dots)"/>

    <g opacity="0.55">
      <circle cx="1124" cy="160" r="132" stroke="#6366F1" stroke-opacity="0.16" stroke-width="1.5"/>
      <circle cx="1124" cy="160" r="96" stroke="#8B5CF6" stroke-opacity="0.14" stroke-width="1.5"/>
      <circle cx="1124" cy="160" r="60" stroke="#A855F7" stroke-opacity="0.12" stroke-width="1.5"/>
      <circle cx="1124" cy="160" r="5" fill="#A855F7" fill-opacity="0.55"/>
    </g>

    <g transform="translate(96 92)">
      <rect width="136" height="136" rx="34" fill="#FFFFFF" fill-opacity="0.045"/>
      <rect x="0.75" y="0.75" width="134.5" height="134.5" rx="33.25" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
      <rect x="31" y="38" width="74" height="15" rx="7.5" fill="url(#accent)"/>
      <rect x="31" y="61" width="57" height="15" rx="7.5" fill="#FFFFFF" fill-opacity="0.80"/>
      <rect x="31" y="84" width="40" height="15" rx="7.5" fill="#FFFFFF" fill-opacity="0.42"/>
      <circle cx="105" cy="91.5" r="4.5" fill="#FFFFFF" fill-opacity="0.30"/>
    </g>

    <text x="268" y="158" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.8">UniSkills</text>

    <text x="270" y="198" fill="#A5B4FC" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="0.1">Universal, evidence-driven skills for AI agents</text>

    <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.6">
      <g transform="translate(270 220)">
        <rect width="104" height="30" rx="15" fill="#6366F1" fill-opacity="0.16"/>
        <text x="17" y="20" fill="#C7D2FE">METHOD</text>
      </g>
      <g transform="translate(386 220)">
        <rect width="122" height="30" rx="15" fill="#22D3EE" fill-opacity="0.12"/>
        <text x="17" y="20" fill="#A5F3FC">EVIDENCE</text>
      </g>
      <g transform="translate(520 220)">
        <rect width="96" height="30" rx="15" fill="#A855F7" fill-opacity="0.16"/>
        <text x="17" y="20" fill="#E9D5FF">DEPTH</text>
      </g>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="27.25" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
</svg>
